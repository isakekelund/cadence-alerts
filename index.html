<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence Alerts</title>
<meta name="description" content="Notifications from Cadence.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alerts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101618" media="(prefers-color-scheme: dark)">
<style>
:root{
  --paper:#F4F5F1; --surface:#FFFFFF; --ink:#1C2629; --soft:#566266; --faint:#97A1A3; --line:#DEE3DF;
  --sun:#E59A2F; --ok:#2C8660; --warn:#CC452B;
  --font-display:"Fraunces",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-data:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101618; --surface:#172023; --ink:#E6ECEA; --soft:#A1ADAF; --faint:#667376; --line:#253034;
  --sun:#F0AE4A; --ok:#4DB887; --warn:#EE6A50;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
header img{width:52px;height:52px;border-radius:12px}
h1{font:600 28px/1.15 var(--font-display);margin:0}
header p{margin:2px 0 0;color:var(--soft);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.state{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.state i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.state.on i{background:var(--ok)} .state.wait i{background:var(--sun)} .state.bad i{background:var(--warn)}
h2{font:600 21px/1.25 var(--font-display);margin:0 0 8px}
.card p{margin:0 0 12px;color:var(--soft)}
.card p:last-child{margin-bottom:0}
ol{margin:0 0 4px;padding-left:20px;color:var(--soft)} ol li{margin:4px 0}
.code{font:600 30px/1 var(--font-data);letter-spacing:.12em;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;margin:4px 0 14px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
button{appearance:none;font:600 16px/1 var(--font-body);border-radius:12px;padding:15px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;width:100%}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.note{margin-top:14px;font-size:14px;color:var(--soft);min-height:1.5em}
.note.err{color:var(--warn)}
footer{margin-top:22px;font-size:14px;color:var(--faint)}
footer a{color:var(--soft)}
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon-192.png" alt="">
    <div><h1>Cadence Alerts</h1><p>Notifications from Cadence on this phone.</p></div>
  </header>
  <section class="card" id="card" aria-live="polite"><p>Checking this device…</p></section>
  <footer>Tapping a notification opens <a href="https://claude.ai/artifact/JCcrHbJtuJMPXvsqPoTBSy">Cadence</a>.</footer>
</main>
<script>
// A tapped notification opens Alerts with ?open=<address> (sw.js); go on to that part of Cadence.
(function(){
  const to = new URLSearchParams(location.search).get('open');
  if (to && /^https:\/\/claude\.ai\//.test(to)) { history.replaceState(null, '', location.pathname); location.replace(to); }
})();
(function(){
  const FN = 'https://bttliinpthrngngohbcv.supabase.co/functions/v1/push';
  const card = document.getElementById('card');
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  let reg = null, busy = false, note = '', noteErr = false;

  async function api(action, body){
    const r = await fetch(FN + '?action=' + action, body ? {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)} : {});
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; e.body = j; throw e; }
    return j;
  }
  const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
  const sameKey = (buf, key) => { if (!buf) return false; const a = new Uint8Array(buf), b = b64(key); return a.length === b.length && a.every((v, i) => v === b[i]); };
  const device = () => (isIOS ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : 'Browser') + (standalone ? ' home screen' : '');

  function render(view){
    const btn = (id, label, primary) => `<button id="${id}"${primary ? ' class="primary"' : ''}${busy ? ' disabled' : ''}>${label}</button>`;
    const v = {
      unsupported: ['bad', 'Not supported', 'This browser cannot show notifications', '<p>Open this page in Safari on an iPhone with iOS 16.4 or later, or in Chrome, Edge or Firefox on a computer.</p>'],
      homescreen: ['wait', 'One step first', 'Add Alerts to your Home Screen', '<p>iPhone only sends notifications to apps on the Home Screen.</p><ol><li>Tap the Share button in Safari.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open <b>Alerts</b> from the Home Screen and turn notifications on there.</li></ol>'],
      denied: ['bad', 'Blocked', 'Notifications are turned off for Alerts', isIOS ? '<p>Open Settings → Notifications → Alerts and turn on Allow Notifications. Then come back here.</p>' : '<p>Allow notifications for this site in the browser’s site settings, then reload the page.</p>'],
      off: ['', 'Off', 'Get Cadence on your lock screen', '<p>A short note when your morning brief is ready and when the week’s news is out. Your phone’s Focus and Sleep settings still decide when you see them.</p>' + '<div class="btns">' + btn('on', 'Turn on notifications', true) + '</div>'],
      pending: ['wait', 'Waiting for approval', 'Approve this phone', `<p>New phones get nothing until you approve them. Ask Claude: “Approve Cadence Alerts device ${view.code}”.</p><div class="code">${view.code}</div><div class="btns">${btn('check', 'Check again', true)}${btn('off', 'Turn off')}</div>`],
      on: ['on', 'On', 'Notifications are on', '<p>You will hear from Cadence when the morning brief is ready and when the week’s news is out.</p><div class="btns">' + btn('test', 'Send a test notification', true) + btn('off', 'Turn off') + '</div>'],
      error: ['bad', 'Can’t reach Cadence', 'Something went wrong', '<p>The notification server did not answer. Check the connection and try again.</p><div class="btns">' + btn('retry', 'Try again', true) + '</div>'],
    }[view.name];
    card.innerHTML = `<div class="state ${v[0]}"><i></i>${v[1]}</div><h2>${v[2]}</h2>${v[3]}<div class="note${noteErr ? ' err' : ''}">${note}</div>`;
    const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
    on('on', turnOn); on('off', turnOff); on('test', sendTest); on('check', refresh); on('retry', refresh);
  }
  function say(msg, err){ note = msg; noteErr = !!err; }

  async function subscribe(key){
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64(key)});
    const j = sub.toJSON();
    return api('subscribe', {subscription: {endpoint: j.endpoint, keys: j.keys}, vapidKey: key, tz: Intl.DateTimeFormat().resolvedOptions().timeZone, device: device()});
  }

  async function refresh(){
    say('');
    if (isIOS && !standalone) return render({name: 'homescreen'});
    if (!supported) return render({name: 'unsupported'});
    if (Notification.permission === 'denied') return render({name: 'denied'});
    try {
      reg = reg || await navigator.serviceWorker.register('sw.js', {scope: './'});
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub || Notification.permission !== 'granted') return render({name: 'off'});
      const {publicKey} = await api('key');
      if (!sameKey(sub.options && sub.options.applicationServerKey, publicKey)) {
        // The server has a new key pair: drop the old subscription and make a new one.
        await sub.unsubscribe().catch(() => {});
        const r = await subscribe(publicKey);
        return render(r.approved ? {name: 'on'} : {name: 'pending', code: r.code});
      }
      let s = await api('status', {endpoint: sub.endpoint});
      if (!s.known) s = await subscribe(publicKey);
      render(s.approved ? {name: 'on'} : {name: 'pending', code: s.code});
    } catch (e) {
      console.error(e); render({name: 'error'});
    }
  }

  function turnOn(){
    if (busy) return;
    busy = true; say('');
    // Ask for permission first, straight from the tap, as iPhone requires.
    const asked = Notification.requestPermission();
    render({name: 'off'});
    (async () => {
      try {
        const p = await asked;
        if (p !== 'granted') { busy = false; return render({name: p === 'denied' ? 'denied' : 'off'}); }
        reg = reg || await navigator.serviceWorker.register('sw.js', {scope: './'});
        await navigator.serviceWorker.ready;
        const {publicKey} = await api('key');
        const old = await reg.pushManager.getSubscription();
        if (old) await old.unsubscribe().catch(() => {});
        const r = await subscribe(publicKey);
        busy = false;
        render(r.approved ? {name: 'on'} : {name: 'pending', code: r.code});
      } catch (e) {
        console.error(e); busy = false; say('Could not turn notifications on. ' + (e.message || ''), true); render({name: 'off'});
      }
    })();
  }

  async function turnOff(){
    if (busy) return;
    busy = true;
    try {
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) { await api('unsubscribe', {endpoint: sub.endpoint}).catch(() => {}); await sub.unsubscribe(); }
      say('Notifications are off on this phone.');
    } catch (e) { say('Could not turn off: ' + e.message, true); }
    busy = false; render({name: 'off'});
  }

  async function sendTest(){
    if (busy) return;
    busy = true; say('Sending…'); render({name: 'on'});
    try {
      const sub = await reg.pushManager.getSubscription();
      await api('test', {endpoint: sub.endpoint});
      say('Sent. It should arrive within a few seconds.');
    } catch (e) {
      say(e.status === 429 ? 'One test a minute. Try again shortly.' : e.status === 403 ? 'This phone is not approved yet.' : 'The test did not go through (' + e.message + ').', true);
    }
    busy = false; render({name: 'on'});
  }

  // Local preview of each state: http://localhost:8790/#state=pending
  const forced = location.hostname === 'localhost' && (location.hash.match(/state=(\w+)/) || [])[1];
  if (forced) render({name: forced, code: 'A1B2C3'}); else refresh();
  document.addEventListener('visibilitychange', () => { if (!forced && document.visibilityState === 'visible' && !busy) refresh(); });
})();
</script>
</body>
</html>
